<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un compte · Sous-titrage automatique</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <header>
    <h1>Sous-titrage automatique</h1>
  </header>

  <main>
    <form id="auth" class="card narrow" data-endpoint="/api/auth/register" data-confirm>
      <h2>Créer un compte</h2>
      <div class="form-grid">
        <label>Nom d'utilisateur
          <input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"
                 minlength="3" maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{2,31}" required>
          <small>3 à 32 caractères : lettres, chiffres, point, tiret, tiret bas.</small>
        </label>
        <label>Mot de passe
          <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <small>8 caractères au minimum. Il est stocké haché et ne peut pas être récupéré : en cas d'oubli, il faut contacter l'administrateur.</small>
        </label>
        <label>Confirmer le mot de passe
          <input id="confirm" type="password" autocomplete="new-password" maxlength="128" required>
        </label>
        <button class="primary">Créer mon compte</button>
      </div>
      <p id="error" class="error" hidden></p>
      <small>Déjà un compte ? <a href="login.html">Se connecter</a></small>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
