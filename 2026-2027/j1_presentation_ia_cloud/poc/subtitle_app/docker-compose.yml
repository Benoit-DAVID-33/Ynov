services:
  subtitle-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: openai/whisper-medium
      DEVICE: auto
      WORKERS: 1
      ADMIN_TOKEN: change-me
    volumes:
      - subtitle-data:/data
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped   # relaunch automatically after a crash
    # GPU (needs the NVIDIA container toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  subtitle-data:
  hf-cache:
