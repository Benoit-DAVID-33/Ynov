# Scrape targets of the compose services, on the internal network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # HTTP requests of the user application.
  - job_name: api
    static_configs:
      - targets: ["api:9100"]

  # State read from the database: queue, workers, accounts, storage.
  - job_name: admin
    static_configs:
      - targets: ["admin:9100"]

  # Jobs and stages. DNS discovery: every replica of `docker compose up --scale worker=N`.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  # Inference server (GPU mode, docker-compose.gpu.yml): requests, latency, queue,
  # GPU use per model. Reported down in CPU mode, where there is no Triton.
  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
