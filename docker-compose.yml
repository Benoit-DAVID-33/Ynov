# Works as is, with no .env: `docker compose up -d --build` builds the image and starts
# the database, the application, the admin console and the worker. Start with
# scripts/run_docker.ps1 (Windows) or scripts/run_docker.sh (Linux) to pick the CPU or
# GPU variant. By hand:
#   CPU : docker compose up -d --build
#   GPU : DEVICE=gpu docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

name: subtitle-app

x-app: &app
  image: subtitle-app:${DEVICE:-cpu}
  build:
    context: .
    args:
      DEVICE: ${DEVICE:-cpu}
  restart: unless-stopped

x-app-env: &app-env
  # The database is only reachable from the compose network and from this machine
  # (127.0.0.1), so the default password is fine for a trial; set POSTGRES_PASSWORD
  # in .env before the first start of a server (the volume keeps the first one).
  DATABASE_URL: postgresql+psycopg://subtitle:${POSTGRES_PASSWORD:-subtitle}@db:5432/subtitle
  # cpu or gpu: also selects the default model and batch size (see .env.example).
  DEVICE: ${DEVICE:-cpu}
  ENABLED_MODELS: ${ENABLED_MODELS:-whisper-medium.en,whisper-small.en,whisper-medium,whisper-small}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-}
  ENABLED_TRANSLATORS: ${ENABLED_TRANSLATORS:-opus-mt-en-fr,opus-mt-en-es,opus-mt-en-ru,opus-mt-en-ar,opus-mt-en-zh}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
  MAX_DURATION_S: ${MAX_DURATION_S:-7200}
  RETENTION_DAYS: ${RETENTION_DAYS:-7}
  SESSION_DAYS: ${SESSION_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  MAX_REGISTRATIONS_PER_HOUR: ${MAX_REGISTRATIONS_PER_HOUR:-20}
  MAX_PENDING_MEDIA_S: ${MAX_PENDING_MEDIA_S:-14400}
  MAX_PENDING_JOBS_PER_VISITOR: ${MAX_PENDING_JOBS_PER_VISITOR:-4}
  # Empty / 0 = chosen from DEVICE (cpu: superfast, CRF 23; gpu: medium, CRF 26).
  BURN_PRESET: ${BURN_PRESET:-}
  BURN_CRF: ${BURN_CRF:-0}
  # Single sign-on through the keycloak service below. The server reads the discovery
  # document on the internal network; Keycloak publishes KEYCLOAK_URL for the browsers.
  # OIDC_DISCOVERY_URL empty = password login only.
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL-http://keycloak:8080/realms/subtitle/.well-known/openid-configuration}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-subtitle-app}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-subtitle-dev-secret}
  OIDC_PROVIDER: ${OIDC_PROVIDER:-keycloak}
  OIDC_LABEL: ${OIDC_LABEL:-Keycloak}
  # Prometheus metrics of each service, on the internal network only (never published).
  METRICS_PORT: 9100

services:
  db:
    image: subtitle-db:16
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: subtitle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subtitle}
      POSTGRES_DB: subtitle
    # Reachable from this machine only (development, tests, psql); the services use the
    # internal network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtitle"]
      interval: 5s
      timeout: 3s
      retries: 10

  # User-facing application.
  api:
    <<: *app
    # No access log: the health check alone would write a line every 10 s.
    command: ["uvicorn", "app.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *app-env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Admin console: its own service and port, so it stays reachable (logs, service
  # status) when the application or the workers are down. It waits for the database only
  # to start (to create the first administrator); a later outage is handled at runtime.
  admin:
    <<: *app
    command: ["uvicorn", "app.admin:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      # Used once, to create the first administrator account when none exists yet.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      API_URL: http://api:8000
    ports:
      - "${ADMIN_PORT:-8001}:8001"
    volumes:
      - data:/data

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      BATCH_SIZE: ${BATCH_SIZE:-0}
      CPU_THREADS: ${CPU_THREADS:-0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      FAST_LANE_SLOTS: ${FAST_LANE_SLOTS:-1}
      FAST_LANE_MAX_S: ${FAST_LANE_MAX_S:-300}
      SPEAKER_IDENTIFIER: ${SPEAKER_IDENTIFIER:-}
    volumes:
      - data:/data
      - models:/models
    # Lets a running job finish its current step before the container is killed;
    # an interrupted job is requeued automatically at the next start.
    stop_grace_period: 2m
    depends_on:
      api:
        condition: service_healthy

  # Single sign-on (OpenID Connect). Development mode: HTTP, built-in database in the
  # keycloak volume. The realm "subtitle" (client subtitle-app, account demo /
  # demo-password) is built into the image (keycloak/) and imported at the first start.
  # Administration: KEYCLOAK_URL/admin, account admin / KEYCLOAK_ADMIN_PASSWORD.
  keycloak:
    image: subtitle-keycloak:26.0.7
    build: ./keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      # Browsers use this address; the application reaches http://keycloak:8080
      # (back-channel URLs follow the address of each request).
      - --hostname=${KEYCLOAK_URL:-http://localhost:8080}
      - --hostname-backchannel-dynamic=true
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      # The realm file is in the image (data/import): Docker copies it into a new volume.
      - keycloak:/opt/keycloak/data

  # Observability: Prometheus scrapes the metrics of every service (and of Triton in
  # GPU mode), Grafana shows them on a provisioned dashboard.
  #   Grafana     http://localhost:3001  (admin / GRAFANA_ADMIN_PASSWORD)
  #   Prometheus  http://localhost:9090  (this machine only)
  prometheus:
    image: subtitle-prometheus:3.5.0
    build: ./observability/prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: subtitle-grafana:12.1.1
    build: ./observability/grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

volumes:
  db:
  data:
  models:
  keycloak:
  prometheus:
  grafana:
